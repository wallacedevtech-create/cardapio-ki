<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Ki Hot Dog | Cardápio</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;700;800&family=Permanent+Marker&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bk: #0d0b0a;
            --br: #25130c;
            --or: #ff7800;
            --ye: #ffc21a;
            --cr: #f5e9d2;
            --rd: #8f2417;
            --mu: #a99d91;
            --hero: url(fundo\ top.png) ;
            color-scheme: dark;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 74px;
            height: auto
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        body {
            background: var(--bk) radial-gradient(circle at 15% 0, rgba(255, 120, 0, .13), transparent 32%);
            color: var(--cr);
            font: 500 15px/1.5 Montserrat, Arial, sans-serif;
            overflow-x: hidden
        }

        button {
            font: inherit;
            cursor: pointer;
            color: inherit
        }

        :focus-visible {
            outline: 3px solid var(--ye);
            outline-offset: 2px
        }

        h1,
        h2,
        h3,
        .pr,
        .tot {
            font-family: Anton, Impact, sans-serif;
            font-weight: 400;
            text-transform: uppercase
        }

        /* HERO: a única sequência de entrada orquestrada */
        .hero {
            min-height: 86vh;
            display: grid;
            align-content: center;
            padding: 48px 20px 80px;
            background: linear-gradient(90deg, #0d0b0af2 0, #0d0b0ac4 40%, #0d0b0a2e 100%), linear-gradient(180deg, transparent 72%, var(--bk)), var(--hero) 72% center/cover
        }

        .hero-in {
            max-width: 1180px;
            width: 100%;
            margin: auto
        }

        .logo {
            width: clamp(210px, 30vw, 380px);
            display: block;
            animation: drop 1s cubic-bezier(.2, 1.5, .4, 1) both;
            filter: drop-shadow(0 10px 30px #000a)
        }

        @keyframes drop {
            from {
                opacity: 0;
                transform: translateY(-90px) rotate(-9deg) scale(.8)
            }
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(38px)
            }
        }

        .hero h1 {
            font-size: clamp(3.2rem, 9vw, 6.6rem);
            line-height: .92;
            margin: 22px 0 14px;
            text-shadow: 5px 5px 0 #ff780055
        }

        .hero h1 span {
            display: block;
            animation: up .7s .55s both
        }

        .hero h1 span+span {
            color: var(--or);
            transform: rotate(-3deg);
            transform-origin: left;
            animation-delay: .75s;
            font-family: "Permanent Marker", cursive;
            text-transform: none;
            font-size: .82em
        }

        .hero p {
            max-width: 460px;
            color: #e3d8c9;
            animation: up .7s 1s both
        }

        .cta {
            display: flex;
            gap: 12px;
            margin-top: 26px;
            flex-wrap: wrap;
            animation: up .7s 1.15s both
        }

        .btn {
            border: 0;
            border-radius: 9px;
            background: var(--or);
            color: #160d08;
            font-weight: 800;
            text-transform: uppercase;
            font-size: .75rem;
            letter-spacing: .3px;
            padding: 13px 20px;
            min-height: 46px;
            box-shadow: 5px 5px 0 var(--ye);
            transition: transform .2s, box-shadow .2s;
            display: inline-flex;
            align-items: center
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0 var(--ye)
        }

        .btn:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 var(--ye)
        }

        .btn.o {
            background: #0006;
            color: var(--cr);
            box-shadow: none;
            border: 1px solid #f5e9d273
        }

 

        .cartb {
            position: relative;
            border: 0;
            background: var(--ye);
            color: #160d08;
            font-weight: 800;
            border-radius: 9px;
            padding: 10px 14px;
            font-size: .78rem
        }

        .cartb b {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--rd);
            color: var(--cr);
            min-width: 22px;
            height: 22px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            font-size: .72rem
        }

        .bump {
            animation: bump .4s
        }

        @keyframes bump {
            40% {
                transform: scale(1.18) rotate(-4deg)
            }
        }

        /* SEÇÕES E CARDS */
        main {
            max-width: 1180px;
            margin: auto;
            padding: 0 18px
        }

        .sec {
            padding: 64px 0 10px
        }

        .eb {
            font: 1rem "Permanent Marker", cursive;
            color: var(--ye);
            display: inline-block;
            transform: rotate(-2deg)
        }

        .sec h2 {
            font-size: clamp(2.4rem, 6vw, 4rem);
            line-height: 1
        }

        .sec h2 b {
            font-weight: 400;
            color: var(--or)
        }

        .sd {
            color: var(--mu);
            max-width: 560px;
            margin: 8px 0 22px;
            font-size: .88rem
        }

        .sd:after {
            content: "";
            display: block;
            width: 130px;
            height: 9px;
            margin-top: 14px;
            background: var(--ye);
            transform: skew(-18deg);
            clip-path: polygon(0 40%, 10% 10%, 35% 30%, 55% 0, 80% 28%, 100% 5%, 96% 80%, 70% 60%, 45% 100%, 20% 72%, 0 100%)
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
            gap: 20px
        }

        .card {
            display: flex;
            flex-direction: column;
            background: linear-gradient(150deg, var(--br), #15110e);
            border: 1px solid #ff78003a;
            border-radius: 18px;
            overflow: hidden;
            transition: transform .3s, border-color .3s, box-shadow .3s
        }

        .card:hover {
            transform: translateY(-6px) rotate(-.5deg);
            border-color: var(--or);
            box-shadow: 0 18px 40px #ff780024
        }

        .rv {
            opacity: 0;
            transform: translateY(26px);
            transition: opacity .6s, transform .6s
        }

        .rv.v {
            opacity: 1;
            transform: none
        }

        .ph {
            height: 175px;
            position: relative;
            display: grid;
            place-items: center;
            font-size: 4.6rem;
            background: transparent
        }

        .ph.e {
            background: radial-gradient(circle, #ff780055, transparent 68%), #1b0f09
        }

        .ph span {
            transition: transform .35s
        }

        .ph img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card:hover .ph span {
            transform: scale(1.2) rotate(-8deg)
        }

        .lb {
            position: absolute;
            top: 12px;
            left: 12px;
            font: 800 .66rem Montserrat;
            font-style: normal;
            text-transform: uppercase;
            background: var(--ye);
            color: #160d08;
            padding: 5px 9px;
            border-radius: 5px;
            transform: rotate(-4deg)
        }

        .cb {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 6px
        }

        .cb h3 {
            font-size: 1.45rem;
            line-height: 1.1
        }

        .cb p {
            color: var(--mu);
            font-size: .84rem;
            flex: 1
        }

        .pb {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-top: 12px
        }

        .pr {
            font-size: 1.8rem;
            color: var(--ye);
            line-height: 1
        }

        .pr small {
            display: block;
            font: 700 .62rem Montserrat;
            color: var(--mu);
            text-transform: uppercase;
            margin-bottom: 3px
        }

        /* MODAL E CARRINHO */
        .ov {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: #000b;
            display: none;
            align-items: flex-end;
            justify-content: center
        }

        .ov.open {
            display: flex;
            animation: fade .2s
        }

        @keyframes fade {
            from {
                opacity: 0
            }
        }

        .pan {
            background: #17100c;
            border: 1px solid #ff78005c;
            border-radius: 22px 22px 0 0;
            width: min(560px, 100%);
            max-height: 92vh;
            overflow: auto;
            animation: slide .35s cubic-bezier(.2, .9, .3, 1)
        }

        @keyframes slide {
            from {
                transform: translateY(60px);
                opacity: 0
            }
        }

        @media(min-width:700px) {
            .ov {
                align-items: center
            }

            .pan {
                border-radius: 22px
            }
        }

        .ph2 {
            padding: 22px 22px 6px;
            position: relative
        }

        .ph2 h3 {
            font-size: 2rem;
            line-height: 1;
            color: var(--or);
            padding-right: 40px
        }

        .ph2 p {
            color: var(--mu);
            font-size: .85rem;
            margin-top: 6px
        }

        .x {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid #fff3;
            background: #0008;
            font-size: 1.1rem
        }

        fieldset {
            border: 0;
            padding: 12px 22px;
            min-width: 0
        }

        legend {
            font-family: Anton;
            text-transform: uppercase;
            font-size: 1.05rem;
            color: var(--ye);
            float: left;
            width: 100%;
            margin-bottom: 2px
        }

        fieldset small {
            display: block;
            clear: both;
            color: var(--mu);
            font-size: .72rem;
            margin-bottom: 9px
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        .chip {
            border: 1.5px solid #fff3;
            background: #1d130e;
            border-radius: 99px;
            padding: 9px 14px;
            font-weight: 700;
            font-size: .8rem;
            transition: .18s
        }

        .chip:hover {
            border-color: var(--or)
        }

        .chip[aria-pressed=true] {
            background: var(--or);
            border-color: var(--or);
            color: #160d08;
            animation: pop .25s
        }

        .chip[aria-pressed=true]:before {
            content: "✓ "
        }

        @keyframes pop {
            50% {
                transform: scale(1.1)
            }
        }

        .shake {
            animation: sh .35s
        }

        @keyframes sh {
            25% {
                transform: translateX(-6px)
            }

            75% {
                transform: translateX(6px)
            }
        }

        textarea,
        input {
            width: 100%;
            background: #0d0906;
            border: 1.5px solid #fff3;
            border-radius: 10px;
            color: var(--cr);
            padding: 11px;
            font: inherit;
            font-size: .85rem;
            resize: none
        }

        .foot {
            position: sticky;
            bottom: 0;
            background: #17100c;
            border-top: 1px solid #ff78003a;
            padding: 14px 22px;
            display: flex;
            align-items: center;
            gap: 14px
        }

        .qty {
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1.5px solid #fff3;
            border-radius: 10px
        }

        .qty button {
            width: 38px;
            height: 40px;
            border: 0;
            background: none;
            font-size: 1.2rem;
            font-weight: 800
        }

        .qty span {
            min-width: 24px;
            text-align: center;
            font-weight: 800
        }

        .foot .btn {
            flex: 1;
            justify-content: space-between
        }

        .tot {
            font-size: 1.25rem
        }

        .dr {
            align-items: stretch;
            justify-content: flex-end
        }

        .dr .pan {
            height: 100%;
            max-height: 100%;
            width: min(440px, 100%);
            border-radius: 0;
            animation-name: in
        }

        @keyframes in {
            from {
                transform: translateX(60px);
                opacity: 0
            }
        }

        .li {
            display: flex;
            gap: 10px;
            padding: 14px 22px;
            border-bottom: 1px solid #ffffff14
        }

        .li div {
            flex: 1;
            font-size: .82rem;
            color: var(--mu)
        }

        .li b {
            display: block;
            color: var(--cr);
            font-size: .95rem
        }

        .li .qty {
            align-self: flex-start;
            transform: scale(.85)
        }

        .emp {
            padding: 40px 22px;
            text-align: center;
            color: var(--mu)
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            transform: translate(-50%, 30px);
            background: var(--ye);
            color: #160d08;
            font-weight: 800;
            font-size: .82rem;
            padding: 11px 18px;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            transition: .3s;
            z-index: 90;
            max-width: 90vw;
            text-align: center
        }

        .toast.s {
            opacity: 1;
            transform: translate(-50%, 0)
        }

        footer {
            margin-top: 80px;
            padding: 40px 20px 50px;
            text-align: center;
            border-top: 1px solid #ff78004d;
            color: var(--mu);
            font-size: .8rem
        }

        footer strong {
            display: block;
            font: 1.6rem Anton;
            color: var(--cr);
            text-transform: uppercase
        }

        footer em {
            display: block;
            margin-top: 10px;
            font: 1rem "Permanent Marker";
            color: var(--ye);
            font-style: normal
        }

        .cart-float {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 100;

    display: flex;
    align-items: center;
    gap: 8px;

    border: 0;
    border-radius: 50px;

    padding: 14px 20px;

    background: var(--ye);
    color: #160d08;

    font-weight: 900;
    font-size: .85rem;

    box-shadow: 5px 5px 0 var(--or);

    cursor: pointer;

    transition:
        transform .2s,
        box-shadow .2s;
}

.cart-float:hover {
    transform: translateY(-3px);
    box-shadow: 7px 7px 0 var(--or);
}

.cart-float:active {
    transform: translateY(2px);
    box-shadow: 2px 2px 0 var(--or);
}

.cart-float b {
    position: absolute;

    top: -7px;
    right: -7px;

    min-width: 23px;
    height: 23px;

    padding: 0 5px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background: var(--rd);
    color: var(--cr);

    font-size: .7rem;
}

        @media(max-width:640px) {
            .hero {
                background: linear-gradient(180deg, #0d0b0aee, #0d0b0a9c 60%, var(--bk)), var(--hero) 75% center/cover
            }
            .cart-float {
                right: 15px;
                bottom: 15px;
                padding: 14px 17px;
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important
            }
        }
    </style>
</head>

<body>
    <header class="hero" id="inicio">
        <div class="hero-in">
            <img class="logo" src="logo.png" alt="Ki Hot Dog — Sabor que vicia!">
            <h1><span>A fome</span><span>chamou?</span></h1>
            <p>Hot dogs, porções, massas, cremes e açaí feitos do seu jeito. Escolha os ingredientes de cada item e
                envie o pedido pelo WhatsApp.</p>
            <div class="cta"><a class="btn" href="#hotdog">Ver cardápio</a><button class="btn o"
                    onclick="openCart()">Meu pedido</button></div>
        </div>
        
    </header>

    <button class="cart-float" id="cb" onclick="openCart()" aria-label="Abrir pedido">
    🛒
        <span>Pedido</span>
        <b id="cc">0</b>
    </button>

    <main id="menu"></main>
    <footer><strong>Ki Hot Dog</strong>Street food premium<em>Sabor que vicia!</em></footer>

    <div class="ov" id="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
        <div class="pan">
            <div class="ph2">
                <h3 id="mt"></h3>
                <p id="md"></p><button class="x" onclick="closeAll()" aria-label="Fechar">✕</button>
            </div>
            <div id="mg"></div>
            <fieldset>
                <legend>Observação</legend><textarea id="obs" rows="2" maxlength="140"
                    placeholder="Ex.: pouco molho, sem cebola…"></textarea>
            </fieldset>
            <div class="foot">
                <div class="qty"><button onclick="qv(-1)" aria-label="Menos">−</button><span id="q">1</span><button
                        onclick="qv(1)" aria-label="Mais">+</button></div>
                <button class="btn" onclick="addCart()"><span>Adicionar</span><span class="tot"
                        id="tot"></span></button>
            </div>
        </div>
    </div>

    <div class="ov dr" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dt">
        <div class="pan" style="display:flex;flex-direction:column">
            <div class="ph2">
                <h3 id="dt">Seu pedido</h3><button class="x" onclick="closeAll()" aria-label="Fechar">✕</button>
            </div>
            <div id="lines" style="flex:1;overflow:auto"></div>
            <fieldset>
                <legend>Seu nome</legend><input id="nm" placeholder="Como devemos te chamar?" autocomplete="given-name">
            </fieldset>
            <div class="foot"><button class="btn" onclick="send()"><span>Enviar no WhatsApp</span><span class="tot"
                        id="ct"></span></button></div>
        </div>
    </div>
    <div class="toast" id="toast" role="status"></div>

    <script>
        const WA = '5564993101018'; // ← troque pelo WhatsApp da Ki Hot Dog (com DDI+DDD)
        const $ = s => document.querySelector(s), R = v => 'R$ ' + v.toFixed(2).replace('.', ',');
        const g = (t, o, x = {}) => ({ t, o, s: x.s, max: x.max, d: x.d || (x.s ? [o[0]] : []) });
        const ING = ['Cenoura', 'Milho', 'Azeitona', 'Palmito', 'Tomate', 'Alface', 'Batata palha'];
        const MOL = ['Molho verde', 'Barbecue', 'Mostarda', 'Ketchup', 'Maionese'];
        const ACAI = [g('Adicionais (Leite Ninho já incluso)', ['Nutella', "M&M's", 'Paçoca', 'Chocolate'], { max: 2 })];
        const CALDA = [g('Calda', ['Chocolate', 'Leite condensado'], { s: 1 })];
        const M = [
            {
                k: 'hotdog', em: '🌭', t: 'Ki |Hot Dog', tag: 'Do seu jeito!', ds: 'O clássico da casa. Tire ou ponha ingredientes e molhos como quiser.', it: [
                    { n: 'Cachorro Quente Tradicional', d: 'Você monta do seu jeito: ingredientes e molhos à sua escolha.', p: 12, from: 1, img: 'hot_simples-removebg-preview.png', lb: 'Mais pedido', g: [g('Ingredientes', ING, { d: ING }), g('Molhos', MOL)] },
                    { n: 'Hot Dog Especial', d: 'Uma combinação caprichada, com todos os molhos da casa.', p: 15, img: 'hot completo.png', lb: 'Especial KI', g: [g('Ingredientes', ING, { d: ING }), g('Molhos', MOL, { d: MOL })] }]
            },
            {
                k: 'massas', 
                em: '🍝', 
                t: 'Macarrão |de Frigideira', 
                tag: 'Crocante e irresistível!', 
                ds: 'Escolha a massa, o molho e seus adicionais favoritos.', 
                it: [
                    { n: 'Macarrão de Frigideira', 
                    d: 'Talharim, esparguete ou penne. Molho vermelho, branco ou os dois.', 
                    p: 20, 
                    img: 'Pasta Cremosa na Frigideira Rústica.png', 
                    g: [g('Massa', ['Talharim', 'Esparguete', 'Penne'], { s: 1 }), g('Molho (até 2)', ['Vermelho', 'Branco'], 
                    { max: 2, d: ['Vermelho'] }), g('Adicionais', ['Bacon', 'Calabresa', 'Presunto', 'Brócolis'])] 
                }]
            },
            {
                k: 'pasteis', 
                em: '🥟', t: 'Pastéis |KI', 
                tag: 'Crocante por fora!', 
                ds: 'Sabores clássicos e o famoso Ki Moda da Casa.', 
                it: [
                    { n: 'Pastel Tradicional', 
                    d: 'Escolha o recheio.', 
                    p: 10, 
                    from: 1, 
                    g: [g('Recheio', ['Carne', 'Frango', 'Queijo'], 
                    { s: 1 })] 
                },
                    { n: 'Ki Moda da Casa', 
                    d: 'O pastel completo. Tire o que não quiser.', 
                    p: 20, 
                    lb: 'Da casa', 
                    g: [g('Recheio', ['Carne', 'Queijo', 'Milho', 'Azeitona', 'Palmito', 'Presunto', 'Tomate', 'Bacon', 'Calabresa'], 
                    { d: ['Carne', 'Queijo', 'Milho', 'Azeitona', 'Palmito', 'Presunto', 'Tomate', 'Bacon', 'Calabresa'] })] 
                }]
            },
            {
                k: 'acai', em: '🍇', t: '|Açaí', tag: 'Energia e sabor!', ds: 'Acompanha Leite Ninho + 2 adicionais à sua escolha.', it: [
                    { n: 'Açaí 300ml', d: 'Leite Ninho + 2 adicionais.', p: 12, g: ACAI }, { n: 'Açaí 500ml', d: 'Leite Ninho + 2 adicionais.', p: 15, g: ACAI }]
            },
            {
                k: 'cremes', em: '🍓', t: '|Cremes', tag: 'Docinho para fechar!', ds: 'Copo de 500ml. Escolha a calda.', it: [
                    { n: 'Creme de Morango', d: '500ml com calda à sua escolha.', p: 15, g: CALDA }, { n: 'Creme de Maracujá', d: '500ml com calda à sua escolha.', p: 15, g: CALDA }]
            },
            {
                k: 'porcoes', em: '🍟', t: 'Batatas |KI', tag: 'Crocante e irresistível!', ds: 'Porções de 240g.', it: [
                    { n: 'Batata Simples', d: 'Acompanha molho rosé.', p: 20, g: [] },
                    { n: 'Batata Completa', d: 'Com a cobertura que você escolher.', p: 25, g: [g('Cobertura', ['Catupiry', 'Cheddar', 'Bacon', 'Calabresa'], { s: 1 })] }]
            },
            {
                k: 'bebidas', em: '🥤', t: '|Bebidas', tag: 'Refrescância na medida!', ds: '', it: [
                    { n: 'Milk Shake 500ml', d: 'Escolha o sabor.', p: 15, g: [g('Sabor', ['Ovomaltine', 'Nutella', 'M&M', 'Chocolate'], { s: 1 })] }]
            }
        ];
        const A = []; M.forEach(c => c.it.forEach(i => { i.c = c; i.id = A.push(i) - 1 }));
        const card = i => `
            <article class="card rv">
                <div class="ph ${i.img ? '' : 'e'}">
                    ${
                        i.img
                            ? `<img src="${i.img}" alt="${i.n}">`
                            : `<span>${i.c.em}</span>`
                    }
                    ${i.lb ? `<i class="lb">${i.lb}</i>` : ''}
                </div>

                <div class="cb">
                    <h3>${i.n}</h3>
                    <p>${i.d}</p>

                    <div class="pb">
                        <div class="pr">
                            ${i.from ? '<small>a partir de</small>' : ''}
                            ${R(i.p)}
                        </div>

                        <button class="btn" onclick="openItem(${i.id})">
                            ${i.g.length ? 'Montar' : 'Adicionar'}
                        </button>
                    </div>
                </div>
            </article>
        `;
        $('#menu').innerHTML = M.map(c => { const [a, b] = c.t.split('|'); return `<section class="sec" id="${c.k}"><span class="eb">${c.tag}</span><h2>${a}<b>${b}</b></h2><p class="sd">${c.ds}</p><div class="grid">${c.it.map(card).join('')}</div></section>` }).join('');
        
        // animações de scroll
        const rv = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { setTimeout(() => e.target.classList.add('v'), (e.target.dataset.d || 0) * 90); rv.unobserve(e.target) } }), { threshold: .1 });
        document.querySelectorAll('.rv').forEach((el, n) => { el.dataset.d = n % 3; rv.observe(el) });
        

        // montar item
        let cur, sel, qty, C = [];
        function openItem(id) {
            cur = A[id]; sel = cur.g.map(x => new Set(x.d)); qty = 1; $('#obs').value = ''; $('#mt').textContent = cur.n; $('#md').textContent = cur.d;
            $('#mg').innerHTML = cur.g.map((x, gi) => `<fieldset><legend>${x.t}</legend><small>${x.s ? 'Escolha 1' : x.max ? 'Escolha até ' + x.max : 'Toque para tirar ou pôr'}</small><div class="chips">${x.o.map((o, oi) => `<button class="chip" aria-pressed="${sel[gi].has(o)}" onclick="pick(${gi},${oi},this)">${o}</button>`).join('')}</div></fieldset>`).join('');
            upd(); show('#sheet')
        }
        function pick(gi, oi, el) {
            const x = cur.g[gi], o = x.o[oi], S = sel[gi];
            if (x.s) { S.clear(); S.add(o) } else if (S.has(o)) S.delete(o); else if (x.max && S.size >= x.max) { toast('Você pode escolher até ' + x.max + ' opções aqui'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); return } else S.add(o);
            [...el.parentNode.children].forEach((b, k) => b.setAttribute('aria-pressed', S.has(x.o[k])))
        }
        function qv(n) { qty = Math.max(1, Math.min(20, qty + n)); upd() }
        function upd() { $('#q').textContent = qty; $('#tot').textContent = R(cur.p * qty) }
        function addCart() {
            const o = cur.g.map((x, gi) => { const v = [...sel[gi]]; return v.length ? `${x.t.replace(/ \(.*\)/, '')}: ${v.join(', ')}` : (x.s ? '' : `Sem ${x.t.toLowerCase()}`) }).filter(Boolean);
            C.push({ n: cur.n, p: cur.p, q: qty, o, obs: $('#obs').value.trim() }); closeAll(); draw(); toast('✓ ' + cur.n + ' no pedido');
            const b = $('#cb'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump')
        }

        // carrinho
        const tot = () => C.reduce((s, i) => s + i.p * i.q, 0);
        function draw() {
            $('#cc').textContent = C.reduce((s, i) => s + i.q, 0); $('#ct').textContent = R(tot());
            $('#lines').innerHTML = C.length ? C.map((i, k) => `<div class="li"><div><b>${i.n}</b>${i.o.join(' • ')}${i.obs ? `<br>Obs: ${i.obs.replace(/</g, '&lt;')}` : ''}<br><span style="color:var(--ye);font-weight:800">${R(i.p * i.q)}</span></div><div class="qty"><button onclick="cq(${k},-1)" aria-label="Menos">${i.q == 1 ? '🗑' : '−'}</button><span>${i.q}</span><button onclick="cq(${k},1)" aria-label="Mais">+</button></div></div>`).join('') : '<div class="emp">Seu pedido está vazio.<br>Escolha algo delicioso! 🌭</div>'
        }
        function cq(k, n) { C[k].q += n; if (C[k].q < 1) C.splice(k, 1); draw() }
        function openCart() { draw(); show('#drawer') }
        function send() {
            if (!C.length) { toast('Adicione um item antes de enviar'); return }
            let t = '*PEDIDO KI HOT DOG*\n' + ($('#nm').value.trim() ? 'Cliente: ' + $('#nm').value.trim() + '\n' : '') + '\n';
            C.forEach((i, k) => { t += `${k + 1}. ${i.n} x${i.q} — ${R(i.p * i.q)}\n` + (i.o.length ? '   ' + i.o.join(' | ') + '\n' : '') + (i.obs ? '   Obs: ' + i.obs + '\n' : '') });
            t += '\n*TOTAL: ' + R(tot()) + '*'; window.open('https://wa.me/' + WA + '?text=' + encodeURIComponent(t), '_blank')
        }

        // util
        function show(s) { $(s).classList.add('open'); document.body.style.overflow = 'hidden' }
        function closeAll() { document.querySelectorAll('.ov').forEach(o => o.classList.remove('open')); document.body.style.overflow = '' }
        document.querySelectorAll('.ov').forEach(o => o.addEventListener('click', e => { if (e.target === o) closeAll() }));
        addEventListener('keydown', e => { if (e.key === 'Escape') closeAll() });
        let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('s'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('s'), 2200) }
        draw();
    </script>
</body>

</html>
